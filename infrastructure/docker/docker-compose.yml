version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:v1.13
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    ports: ["8001:8001"]
    env_file: services/api/.env
    depends_on: [qdrant, redis]
volumes:
  qdrant_data:
