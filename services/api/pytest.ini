[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=20
    # Phased rollout: 20% (now) → 40% → 60% → 80% (target)
    # Aktuell 0 Tests — Ziel: 20% mit ersten API-Tests erreichen
markers =
    unit: Unit tests
    integration: Integration tests (require DB)
    e2e: End-to-end tests (require full stack)
    slow: Tests that take >1 second
filterwarnings =
    ignore::DeprecationWarning
