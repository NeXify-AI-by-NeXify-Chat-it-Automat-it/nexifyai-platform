name: Task / Policy
description: Agenten-Aufgabe, Policy-Änderung oder Governance-Auftrag
labels: ["governance"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Was soll erreicht werden?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext / Policy-Bezug
      description: Welche Policy (#11–#16) oder Entscheidung ist relevant?
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Typ
      options:
        - Policy
        - Konfiguration
        - Dokumentation
        - Audit
        - Reparatur
        - Security
        - Code-Fix
        - Deployment
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gates vor Abschluss (alle Pflicht)
      options:
        - label: Brain-Kontext geprüft
        - label: Projektleiter-Kontext geprüft
        - label: Repo klassifiziert
        - label: Evidence dokumentiert
        - label: PR erstellt / gemerged
    validations:
      required: true
