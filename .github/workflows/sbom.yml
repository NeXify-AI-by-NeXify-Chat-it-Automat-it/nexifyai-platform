name: SBOM Generation (CycloneDX/SPDX)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # Weekly: Monday 05:00 UTC

permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: docker://ghcr.io/aquasecurity/trivy:0.58.0
        with:
          args: >-
            filesystem
            --format cyclonedx
            --output /github/workspace/sbom-cyclonedx.json
            --no-progress
            /github/workspace

      - name: Generate SPDX SBOM
        uses: docker://ghcr.io/aquasecurity/trivy:0.58.0
        with:
          args: >-
            filesystem
            --format spdx-json
            --output /github/workspace/sbom-spdx.json
            --no-progress
            /github/workspace

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom-spdx.json
