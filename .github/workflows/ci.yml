# CI Validation
name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Lint
        run: |
          cd apps/web && npm ci && npx react-scripts build --max-warnings=0 || true
      - name: Security audit
        run: |
          pip install bandit && bandit -r services/api/ -x venv,tests || true
