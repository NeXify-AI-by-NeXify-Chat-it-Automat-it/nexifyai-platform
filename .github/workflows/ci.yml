name: CI — NeXifyAI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # 1. QUALITY GATES
  # ═══════════════════════════════════════
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npx eslint src/ --max-warnings=0 --no-error-on-unmatched-pattern 2>&1 || true
        continue-on-error: true
        # TODO: --max-warnings=0 aktivieren nach Code-Cleanup

      - name: Typecheck (Flow/PropTypes)
        run: npx tsc --noEmit --strict 2>&1 || true
        continue-on-error: true
        # TODO: TypeScript-Migration abschließen

      - name: Production build
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Bundle size check
        run: |
          BUILD_DIR="build/static/js"
          if [ -d "$BUILD_DIR" ]; then
            MAX_SIZE=500000  # 500KB
            for f in "$BUILD_DIR"/*.js; do
              SIZE=$(stat -c%s "$f")
              echo "  $(basename $f): $((SIZE/1024))KB"
              if [ $SIZE -gt $MAX_SIZE ]; then
                echo "  ⚠️  $(basename $f) is $((SIZE/1024))KB (limit: $((MAX_SIZE/1024))KB)"
              fi
            done
          fi

  # ═══════════════════════════════════════
  # 2. SECURITY SCAN
  # ═══════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Dependency Audit (npm)
        run: |
          cd frontend
          npm audit --audit-level=high 2>&1 | tail -5 || true
        continue-on-error: true

      - name: Dependency Audit (Python)
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install safety 2>/dev/null
            safety check -r backend/requirements.txt --full-report 2>&1 | head -20 || true
          fi
        continue-on-error: true

  # ═══════════════════════════════════════
  # 3. DOS COMPLIANCE CHECK
  # ═══════════════════════════════════════
  dos-compliance:
    name: DOS v2.0 Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check directory structure
        run: |
          for dir in docs docs/adrs docs/governance docs/incidents packages/config packages/events automations/cron; do
            if [ -d "$dir" ]; then
              echo "✅ $dir"
            else
              echo "❌ $dir fehlt"
            fi
          done

      - name: Check critical files
        run: |
          for file in docs/DOS-v2.0.md docs/adrs/ADR_TEMPLATE.md docs/governance/raci.yaml packages/config/api-standards.ts; do
            if [ -f "$file" ]; then
              SIZE=$(wc -c < "$file")
              echo "✅ $file ($SIZE bytes)"
            else
              echo "❌ $file fehlt"
            fi
          done
