# CI Validation
name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Build check
        run: |
          cd apps/web && npm ci && npx vite build --logLevel error
      - name: Security audit
        run: |
          pip install bandit && bandit -r services/api/ -x venv,tests || true

  # ═══════════════════════════════════════
  # DOCS-GOVERNANCE VALIDATION
  # Runs ONLY on docs/agency changes.
  # No deployment. No secrets. No runtime changes.
  # ═══════════════════════════════════════
  docs-governance:
    name: Docs Governance Validation
    runs-on: ubuntu-latest
    if: |
      contains(toJSON(github.event.commits.*.modified), 'docs/') ||
      contains(toJSON(github.event.commits.*.added), 'docs/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON files in docs/
        run: |
          set +e
          ERRORS=0
          COUNT=0
          for f in $(find docs/ -name '*.json' -not -path '*/node_modules/*' -not -path '*/public/*' 2>/dev/null); do
            COUNT=$((COUNT+1))
            python3 -m json.tool "$f" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "INVALID JSON: $f"
              ERRORS=$((ERRORS+1))
            fi
          done
          echo "JSON files checked: $COUNT, errors: $ERRORS"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Secret pattern scan on docs/
        run: |
          set +e
          FOUND=0
          # Patterns that detect actual secrets (not template/documentation placeholders)
          # - Requires actual value content: not '...' or '<placeholder>' patterns
          PATTERNS='API_KEY=[a-zA-Z0-9]{32,}|SECRET=[a-zA-Z0-9]{32,}|PRIVATE KEY---[^-]|sk-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36}|SUPABASE_SERVICE_ROLE_KEY=[a-zA-Z0-9]{8,}|bearer [a-zA-Z0-9]{40,}|password=[a-zA-Z0-9]{16,}'
          for f in $(find docs/ -type f -not -path '*/node_modules/*' -not -path '*/public/*' 2>/dev/null); do
            # Skip placeholder-only lines: match lines with actual values (not '...' or '<placeholder>')
            RAW_MATCHES=$(grep -Eio "$PATTERNS" "$f" 2>/dev/null)
            if [ -n "$RAW_MATCHES" ]; then
              # Filter out template/placeholder values (..., <name>, etc.)
              while IFS= read -r line; do
                # Only flag if value part looks like a real secret (not template placeholder)
                VALUE_PART=$(echo "$line" | grep -Eo '=.*$' | sed 's/^=//')
                if [ -n "$VALUE_PART" ] && ! echo "$VALUE_PART" | grep -Eq '^(\.\.\.|<[^>]*>)$'; then
                  echo "POTENTIAL SECRET in $f — review required"
                  echo "  Match: $line"
                  FOUND=$((FOUND+1))
                elif [ -z "$VALUE_PART" ]; then
                  # Patterns without '=' (like PRIVATE KEY) — always report
                  echo "POTENTIAL SECRET in $f — review required"
                  echo "  Match: $line"
                  FOUND=$((FOUND+1))
                fi
              done <<< "$RAW_MATCHES"
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "Secret scan found potential matches — block merge"
            exit 1
          fi
          echo "Secret scan: CLEAN"
