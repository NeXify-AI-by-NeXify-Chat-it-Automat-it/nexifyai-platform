# Branch Cleanup
# Policy #5: Repository-Hygiene — alte Branches identifizieren
name: Branch Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'  # Wöchentlich Sonntag 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find stale branches
        id: stale
        run: |
          # Branches ohne Aktivität in 30 Tagen (außer main/docs/und-fix)
          stale=$(git for-each-ref --sort=-committerdate refs/remotes/origin \
            --format='%(refname:short) %(committerdate:relative)' | \
            grep -E '[3-9][0-9]+ days|[0-9]+ months|[0-9]+ years' | \
            grep -v 'origin/main\|origin/docs/' | \
            cut -d' ' -f1 | sed 's|origin/||' || true)

          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$stale" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create cleanup Issue
        if: steps.stale.outputs.branches != ''
        uses: actions/github-script@v9
        with:
          script: |
            const branches = `${{ steps.stale.outputs.branches }}`.split('\n').filter(Boolean);

            if (branches.length === 0) {
              console.log('No stale branches found.');
              return;
            }

            const body = `## 🧹 Stale Branch Cleanup

            Die folgenden Branches wurden seit über 30 Tagen nicht aktualisiert:

            ${branches.map(b => `- \`${b}\``).join('\n')}

            ### Aktionen:
            - [ ] Jeden Branch prüfen
            - [ ] Gelöschte/abgeschlossene Branches entfernen
            - Kommentiere \`/keep branch-name\` um einen Branch zu behalten

            ---
            _Automatisch erstellt von Branch Cleanup Workflow_
            `;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🧹 Stale Branch Cleanup — ' + new Date().toISOString().slice(0, 10),
              body: body,
              labels: ['housekeeping']
            });

            console.log(`Created issue #${issue.data.number}`);
