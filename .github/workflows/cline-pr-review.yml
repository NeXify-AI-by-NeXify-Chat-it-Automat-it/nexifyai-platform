# WARNING: DEAD LEGACY — Cline is no longer the active AI review system.
# This workflow is retained ONLY for historical reference and manual emergency review.
# It MUST NOT be a required check for merge.
# The pull_request trigger has been REMOVED to prevent automatic runs on every PR.
# The environment: cline-actions has been REMOVED to prevent spurious GitHub Deployments.
# Goose / DOS-Governance is the current standard for AI-assisted review.
# Legacy since: 2025 | Disabled: 2026-05-24

name: Cline PR Code Review [LEGACY - DISABLED]

on:
  # pull_request trigger intentionally REMOVED.
  # Cline must not auto-run on PRs — caused failed GitHub Deployments
  # via the cline-actions environment on every docs/governance PR.
  # Use workflow_dispatch for manual emergency review ONLY.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (manual emergency use only)"
        required: true
        type: string

concurrency:
  group: pr-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cline-pr-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # environment: cline-actions
    # REMOVED — root cause of failed GitHub Deployments on docs-only PRs.
    # Restore only if OPENROUTER_API_KEY is set at env/repo level.

    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g @cline/cli

      - name: Configure OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cline auth --provider openrouter --apikey "$OPENROUTER_API_KEY"

      - name: Get PR number
        id: pr
        run: |
          echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Review PR with Cline
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cline --auto-approve true 'Review PR #'"${PR_NUMBER}"' for NeXifyAI. Check security, logic, performance, patterns, tests. Post result as ## 🤖 Cline PR Review comment.'