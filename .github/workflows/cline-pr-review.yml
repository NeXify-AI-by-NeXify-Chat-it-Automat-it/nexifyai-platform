name: Cline PR Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cline-pr-review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cline-actions

    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g @cline/cli

      - name: Configure OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cline auth --provider openrouter --apikey "$OPENROUTER_API_KEY"

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Review PR with Cline
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cline --auto-approve true 'You are a senior code reviewer for NeXifyAI. Review PR #'"${PR_NUMBER}"' thoroughly.

          ## Gather Context
          ```bash
          gh pr view '"${PR_NUMBER}"' --json number,title,body,author,createdAt,labels,files,additions,deletions,baseRefName,headRefName
          gh pr diff '"${PR_NUMBER}"'
          gh pr checks '"${PR_NUMBER}"'
          ```

          ## Review Checklist
          1. **Security**: SQL injection, XSS, secrets exposure, auth bypass
          2. **Logic**: Edge cases, null handling, error states
          3. **Performance**: N+1 queries, unnecessary re-renders, memory leaks
          4. **Patterns**: Consistency with codebase conventions
          5. **Testing**: Missing test coverage, edge case tests

          ## Submit Review
          Post a single comprehensive review comment starting with "## 🤖 Cline PR Review".
          For inline suggestions use: gh api repos/'"${GITHUB_REPO}"'/pulls/'"${PR_NUMBER}"'/reviews -X POST -f event="COMMENT" -f body="..." -F comments='[{"path":"src/file.ts","line":10,"body":"Suggestion: ..."}]'

          Be constructive, specific, and actionable. Prioritize security findings.'
