name: Security — Secrets (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.7/gitleaks_8.24.7_linux_amd64.deb 2>/dev/null \
            || curl -sL -o /tmp/gitleaks.deb https://github.com/gitleaks/gitleaks/releases/download/v8.24.7/gitleaks_8.24.7_linux_amd64.deb
          dpkg -i /tmp/gitleaks.deb 2>/dev/null || sudo dpkg -i /tmp/gitleaks.deb 2>/dev/null
          gitleaks version

      - name: Run Gitleaks (differential)
        run: |
          gitleaks detect --source . --no-git -v --redact --report-path gitleaks-report.json || true
        continue-on-error: true
        # NON-BLOCKING: False positives on AI-generated code / test tokens.
