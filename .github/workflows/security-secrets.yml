name: Security — Secrets (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (differential only)
        shell: bash
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.7/gitleaks_8.24.7_linux_amd64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks detect --source . --no-git -v --redact --report-path gitleaks-report.json || true
        continue-on-error: true
        # NON-BLOCKING: False positives on AI-generated code / test tokens.
