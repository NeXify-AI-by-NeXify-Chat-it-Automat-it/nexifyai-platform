name: Security — Secrets (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gitleaks
          gitleaks version

      - name: Run Gitleaks (differential)
        run: |
          gitleaks detect --source . --no-git -v --redact --report-path gitleaks-report.json || true
        continue-on-error: true
        # NON-BLOCKING: False positives on AI-generated code / test tokens.
