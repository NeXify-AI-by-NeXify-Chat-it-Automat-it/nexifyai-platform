name: Security — Secrets (Gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (differential only)
        uses: gitleaks/gitleaks-action@v2.3.9
        continue-on-error: true
        # NON-BLOCKING: False positives on AI-generated code / test tokens.
