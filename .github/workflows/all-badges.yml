name: Enterprise Status Badges

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # 1. CI/CD BADGES — Real GitHub API queries
  # ═══════════════════════════════════════
  ci-badge:
    name: CI/CD Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Query CI workflow statuses from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Helper: query last run of a workflow and return badge emoji
          get_badge() {
            local wf_name="$1"
            local result conclusion
            result=$(gh run list --workflow "$wf_name" --limit 1 --json conclusion,name 2>/dev/null || echo '[]')
            if echo "$result" | jq -e '. | length > 0' > /dev/null 2>&1; then
              conclusion=$(echo "$result" | jq -r '.[0].conclusion // "unknown"')
            else
              conclusion="no_runs"
            fi
            case "$conclusion" in
              success)   echo "✅";;
              failure)   echo "❌";;
              cancelled) echo "⚠️ cancelled";;
              skipped)   echo "⏭️ skipped";;
              no_runs)   echo "❓ No recent runs";;
              *)         echo "⚠️ ${conclusion}";;
            esac
          }

          echo "## CI/CD Status" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $(get_badge 'CI — NeXifyAI Quality Gates (HARD)') |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $(get_badge 'Tests — pytest + jest') |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenAPI Lint | $(get_badge 'OpenAPI Lint — Spectral') |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════
  # 2. SECURITY BADGES — Real GitHub API queries
  # ═══════════════════════════════════════
  security-badge:
    name: Security Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Query security workflow statuses from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get_badge() {
            local wf_name="$1"
            local result conclusion
            result=$(gh run list --workflow "$wf_name" --limit 1 --json conclusion,name 2>/dev/null || echo '[]')
            if echo "$result" | jq -e '. | length > 0' > /dev/null 2>&1; then
              conclusion=$(echo "$result" | jq -r '.[0].conclusion // "unknown"')
            else
              conclusion="no_runs"
            fi
            case "$conclusion" in
              success)   echo "✅";;
              failure)   echo "❌";;
              cancelled) echo "⚠️ cancelled";;
              skipped)   echo "⏭️ skipped";;
              no_runs)   echo "❓ No recent runs";;
              *)         echo "⚠️ ${conclusion}";;
            esac
          }

          echo "## Security Status" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | $(get_badge 'Security — Secrets (Gitleaks)') |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | $(get_badge 'Security — Container (Trivy)') |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | $(get_badge 'Security — Dependencies') |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | $(get_badge 'Security — CodeQL Analysis') |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM | $(get_badge 'SBOM Generation (CycloneDX/SPDX)') |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════
  # 3. BRAIN / ORACLE BADGES
  #    NOTE: These require VPS-internal access
  #    (Brain process, SQLite, Knowledge Graph)
  #    and CANNOT be queried from GitHub CI.
  # ═══════════════════════════════════════
  brain-badge:
    name: Brain Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Brain Health Check (VPS-limited)
        run: |
          echo "## Brain / Oracle Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **VPS-internal limitation:** Brain badges require" >> $GITHUB_STEP_SUMMARY
          echo "> querying the live Brain process, SQLite memory store," >> $GITHUB_STEP_SUMMARY
          echo "> Knowledge Graph, and reconciliation engine running on" >> $GITHUB_STEP_SUMMARY
          echo "> the VPS. These are not accessible from GitHub Actions CI." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Brain Integrity | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory (SQLite) | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Knowledge Graph | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Retrieval | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Reconciliation | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════
  # 4. RUNTIME BADGES
  #    NOTE: Require VPS-internal access
  #    (session governance, heartbeat, circuit
  #    breaker — all live runtime state) and
  #    CANNOT be queried from GitHub CI.
  # ═══════════════════════════════════════
  runtime-badge:
    name: Runtime Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Runtime Health Check (VPS-limited)
        run: |
          echo "## Runtime Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **VPS-internal limitation:** Runtime badges require" >> $GITHUB_STEP_SUMMARY
          echo "> querying live session governance, heartbeat monitor," >> $GITHUB_STEP_SUMMARY
          echo "> crash recovery, circuit breaker, and event bus — all" >> $GITHUB_STEP_SUMMARY
          echo "> internal VPS state. These are not reachable from CI." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Session Governance | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Heartbeat | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Crash Recovery | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Circuit Breaker | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Bus | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════
  # 5. INFRASTRUCTURE BADGES
  #    Queries Vercel deployment status via
  #    GitHub API (deploy workflow). DNS/TLS
  #    require external monitoring.
  # ═══════════════════════════════════════
  infra-badge:
    name: Infrastructure Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Query infrastructure statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get_badge() {
            local wf_name="$1"
            local result conclusion
            result=$(gh run list --workflow "$wf_name" --limit 1 --json conclusion,name 2>/dev/null || echo '[]')
            if echo "$result" | jq -e '. | length > 0' > /dev/null 2>&1; then
              conclusion=$(echo "$result" | jq -r '.[0].conclusion // "unknown"')
            else
              conclusion="no_runs"
            fi
            case "$conclusion" in
              success)   echo "✅";;
              failure)   echo "❌";;
              cancelled) echo "⚠️ cancelled";;
              skipped)   echo "⏭️ skipped";;
              no_runs)   echo "❓ No recent runs";;
              *)         echo "⚠️ ${conclusion}";;
            esac
          }

          echo "## Infrastructure Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Deploy | $(get_badge 'Vercel Deploy — Post-Deploy Convergence (E6)') |" >> $GITHUB_STEP_SUMMARY
          echo "| Uptime Check | $(get_badge 'Uptime Check') |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ⚠️ requires VPS-internal check |" >> $GITHUB_STEP_SUMMARY
          echo "| API Gateway | ⚠️ external monitoring required |" >> $GITHUB_STEP_SUMMARY
          echo "| TLS | ⚠️ external monitoring required |" >> $GITHUB_STEP_SUMMARY
          echo "| DNS | ⚠️ external monitoring required |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════
  # 6. STATUS JSON GENERATION
  #    Generates a machine-readable status
  #    artifact with real timestamp.
  # ═══════════════════════════════════════
  status-json:
    name: Generate status.json
    runs-on: ubuntu-latest
    needs: [ci-badge, security-badge, brain-badge, runtime-badge, infra-badge]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Generate artifacts
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p status docs/status

          # Status values derived from real checks above:
          # CI and Security come from GitHub API; Brain/Runtime are VPS-limited.
          echo '{"timestamp":"'"$TIMESTAMP"'","brain":"vps-limited","runtime":"vps-limited","security":"monitored-via-ci","infrastructure":"partially-monitored"}' > status/system-status.json

          echo "# NeXifyAI Enterprise Status" > docs/status/README.md
          echo "Generated: $TIMESTAMP" >> docs/status/README.md
          echo "" >> docs/status/README.md
          echo "Brain: vps-limited | Runtime: vps-limited | Security: monitored-via-ci | Infrastructure: partially-monitored" >> docs/status/README.md
          echo "Generated status files"
