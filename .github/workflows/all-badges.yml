name: Generate All Status Badges

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  aggregate-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print status badge overview
        run: |
          OWNER="nexifyai-dev"
          REPO="nexifyai-website-sicherheitskopie"
          echo "## 📊 NeXifyAI Health Check"
          echo ""
          echo "| Workflow | Status |"
          echo "| :--- | :--- |"
          echo "| Security Scan | [![Security Scan](https://github.com/${OWNER}/${REPO}/actions/workflows/security-scan.yml/badge.svg?branch=main&event=push)](https://github.com/${OWNER}/${REPO}/actions/workflows/security-scan.yml) |"
          echo "| CI Quality Gates | [![CI](https://github.com/${OWNER}/${REPO}/actions/workflows/ci.yml/badge.svg?branch=main&event=push)](https://github.com/${OWNER}/${REPO}/actions/workflows/ci.yml) |"
          echo "| Tests | [![Tests](https://github.com/${OWNER}/${REPO}/actions/workflows/test.yml/badge.svg?branch=main&event=push)](https://github.com/${OWNER}/${REPO}/actions/workflows/test.yml) |"
          echo "| Vercel Deploy | [![Vercel](https://github.com/${OWNER}/${REPO}/actions/workflows/deploy.yml/badge.svg?branch=main&event=push)](https://github.com/${OWNER}/${REPO}/actions/workflows/deploy.yml) |"
          echo ""
          echo "> Auto-generated by all-badges.yml — Guardian Workflow"

      - name: Check badge statuses via GitHub API
        run: |
          OWNER="nexifyai-dev"
          REPO="nexifyai-website-sicherheitskopie"
          for workflow in security-scan ci test deploy; do
            BADGE_URL="https://github.com/${OWNER}/${REPO}/actions/workflows/${workflow}.yml/badge.svg?branch=main&event=push"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$BADGE_URL")
            echo "Badge ${workflow}: HTTP ${HTTP}"
          done

      - name: Post status to PR
        uses: peter-evans/commit-comment@v3
        if: github.event_name == 'pull_request'
        with:
          body: |
            ## 🤖 Autonomer Wächter Report

            | Workflow | Status |
            | :--- | :--- |
            | Security Scan | [![Security Scan](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/security-scan.yml/badge.svg)](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/security-scan.yml) |
            | CI | [![CI](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/ci.yml/badge.svg)](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/ci.yml) |
            | Tests | [![Tests](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/test.yml/badge.svg)](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/test.yml) |
            | Vercel Deploy | [![Vercel](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/deploy.yml/badge.svg)](https://github.com/nexifyai-dev/nexifyai-website-sicherheitskopie/actions/workflows/deploy.yml) |
