name: Security — Dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/package*.json"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"
  push:
    branches: [main]
    paths:
      - "frontend/package*.json"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: NPM Audit (HIGH/CRITICAL only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit (HIGH/CRITICAL — non-blocking, react-scripts legacy)
        continue-on-error: true
        run: npm audit --audit-level=high || true
        # NON-BLOCKING: 14 HIGH vulns in react-scripts transitive deps (Issue #39).
        # Cannot fix without major dependency upgrades (React 19, Vite migration planned).
        # Switch to blocking once Dependabot PRs are merged and deps stabilized.

  pip-safety:
    name: Python Safety Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install safety
      - name: Safety Check (BLOCKING)
        run: safety check -r requirements.txt --full-report
        continue-on-error: false
