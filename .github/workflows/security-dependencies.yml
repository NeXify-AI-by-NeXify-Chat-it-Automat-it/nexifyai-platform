name: Security — Dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/package*.json"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"
  push:
    branches: [main]
    paths:
      - "frontend/package*.json"
      - "backend/requirements*.txt"
      - "backend/pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
