name: OpenAPI Lint — Spectral

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'ops/policies/openapi.json'
      - 'backend/routes/**.py'

jobs:
  spectral:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI Structure
        run: python3 .github/scripts/validate_openapi.py
