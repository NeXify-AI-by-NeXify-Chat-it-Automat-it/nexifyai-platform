name: OpenAPI Lint — Spectral

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'ops/policies/openapi.json'
      - 'services/api/**/*.py'
      - '.github/workflows/openapi-lint.yml'
      - '.github/scripts/validate_openapi.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spectral:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate OpenAPI Structure
        run: python3 .github/scripts/validate_openapi.py
