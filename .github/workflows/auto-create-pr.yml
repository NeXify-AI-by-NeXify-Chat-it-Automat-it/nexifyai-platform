# Auto-create PR on push to fix/*, feat/*, chore/* branches
name: Auto Create PR

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and create PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });
            if (prs.length > 0) {
              console.log(`PR already exists: #${prs[0].number}`);
              return;
            }
            const commitMessage = context.payload.head_commit?.message || 'Automated changes';
            const title = commitMessage.split('\n')[0];
            const body = commitMessage.split('\n').slice(1).join('\n').trim() || 'Automated PR';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: context.ref.replace('refs/heads/', ''),
              base: 'main',
              body: body
            });
            console.log(`Created PR #${pr.number}: ${pr.title}`);
            // Add auto-merge label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['auto-merge']
            });
