# AI Code Review Workflow
# Policy #12: Automatisierte PR-Reviews für Governance-Qualität
# Policy #14: Security-Check bei Code-Änderungen
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
      - '**.yml'
      - '**.yaml'
      - '**.json'

jobs:
  review:
    # Nur bei non-docs PRs (Docs-only sind autonom)
    if: ${{ !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get diff
        id: diff
        run: |
          diff=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$diff" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Security-focused Review
        uses: actions/github-script@v7
        with:
          script: |
            const changed_files = `${{ steps.changed.outputs.files }}`.split('\n').filter(Boolean);
            const diff = `${{ steps.diff.outputs.diff }}`;

            // Check security-sensitive patterns
            const securityPatterns = [
              { pattern: /api[_-]?key|secret|password|token|credential/i, label: 'Credentials' },
              { pattern: /exec\(|eval\(|subprocess/i, label: 'Code Execution' },
              { pattern: /http:\/\/(?!localhost)/i, label: 'Insecure HTTP' },
              { pattern: /(SELECT|INSERT|UPDATE|DELETE).*FROM/i, label: 'SQL Query' },
              { pattern: /process\.env/i, label: 'Environment Variables' },
            ];

            let concerns = [];
            for (const { pattern, label } of securityPatterns) {
              if (pattern.test(diff)) {
                concerns.push(label);
              }
            }

            const foundLabels = concerns.length > 0
              ? `### 🔒 Security Concerns Detected\n\n${concerns.map(c => `- ${c}`).join('\n')}`
              : '✅ No security concerns detected in this diff.';

            const body = `## 🤖 AI Code Review

            ### 📋 Summary
            **Changed files:** ${changed_files.length} files

            ### Changed Files
            ${changed_files.map(f => `- \`${f}\``).join('\n')}

            ### Security Check
            ${foundLabels}

            > ⚠️ This is an automated review. All PRs still require human approval per Policy #12.
            `;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
              event: 'COMMENT'
            });
