# AI Code Review Workflow
# Policy #12: Automatisierte PR-Reviews für Governance-Qualität
# Policy #14: Security-Check bei Code-Änderungen
name: AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
      - '**.yml'
      - '**.yaml'
      - '**.json'
  push:

jobs:
  # Push on workflow file = config change, no review needed
  config-check:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow config change
        run: echo "Workflow config updated on ${{ github.ref_name }} — OK."

  # PR review (runs for pull_request_target events only)
  review:
    if: ${{ github.event_name == 'pull_request_target' && !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get diff (truncated to avoid GitHub object size limit)
        id: diff
        run: |
          diff=$(git diff origin/${{ github.base_ref }}...HEAD)
          # Truncate to 50000 chars to avoid GitHub actions Maximum object size exceeded
          truncated="${diff:0:50000}"
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$truncated" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          additions=$(echo "$diff" | grep -c '^+' || true)
          deletions=$(echo "$diff" | grep -c '^-' || true)
          echo "additions=$additions" >> $GITHUB_OUTPUT
          echo "deletions=$deletions" >> $GITHUB_OUTPUT

      - name: Security-focused Review
        uses: actions/github-script@v9
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          DIFF_CONTENT: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            const changed_files = process.env.CHANGED_FILES.split('\n').filter(Boolean);
            const diff = process.env.DIFF_CONTENT || '';

            let concerns = [];
            if (diff.length > 0 && diff.length < 50000) {
                // Only check added lines — skip removed lines, context, comments, docs
              const addedLines = diff.split('\n').filter(l => l.startsWith('+'))
                .map(l => l.replace(/^\+/, '').trim())
                .filter(l => l.length > 0 && !l.startsWith('#') && !l.startsWith('//') && !l.startsWith('*') && !l.startsWith('/*') && !l.startsWith('<'));

              const securityPatterns = [
                { pattern: /(?:api|auth|secret|password|token|credential)[_\-\.]?(?:key|secret|token)?\s*[:=]\s*['"`]/, label: 'Credentials (hardcoded)' },
                { pattern: /exec\(|eval\(|subprocess/i, label: 'Code Execution' },
                { pattern: /http:\/\/(?!localhost)/i, label: 'Insecure HTTP' },
                { pattern: /(?:SELECT|INSERT|UPDATE|DELETE)\s+.+\s+FROM/i, label: 'SQL Query' },
                { pattern: /process\.env\./i, label: 'Environment Variables' },
              ];
              for (const { pattern, label } of securityPatterns) {
                for (const line of addedLines) {
                  if (pattern.test(line)) {
                    concerns.push(label);
                    break;
                  }
                }
              }
            } else if (diff.length >= 50000) {
              concerns.push('Diff truncated — skipped full pattern analysis');
            }

            const additions = parseInt('${{ steps.diff.outputs.additions || 0 }}') || 0;
            const deletions = parseInt('${{ steps.diff.outputs.deletions || 0 }}') || 0;

            const foundLabels = concerns.length > 0
              ? '### 🔒 Security Scan\n\n- ' + concerns.join('\n- ')
              : '✅ No security concerns detected.';

            const body = [
              '## 🤖 AI Code Review',
              '',
              '### 📋 Summary',
              '**Changed files:** ' + changed_files.length + ' files',
              '**Additions:** ' + additions + ' | **Deletions:** ' + deletions,
              '',
              '### Changed Files',
              changed_files.map(f => '- `' + f + '`').join('\n'),
              '',
              foundLabels,
              '',
              '> ⚠️ Automated review — human approval still required per Policy #12.'
            ].join('\n');

            // GITHUB_TOKEN can't approve (ruleset 422). Fallback to COMMENT.
            let reviewEvent = 'COMMENT';
            try {
              reviewEvent = concerns.length === 0 ? 'APPROVE' : 'COMMENT';
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: body,
                event: reviewEvent
              });
            } catch {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: body,
                event: 'COMMENT'
              });
              reviewEvent = 'COMMENT';
            }

            // On approve: add auto-merge label so automation workflow
            // enables native GitHub auto-merge. Skips docs-only PRs
            // (they don't need CI/pipeline) and large PRs.
            if (reviewEvent === 'APPROVE' && changed_files.length <= 20) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('auto-merge')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['auto-merge'],
                });
              }
            }
