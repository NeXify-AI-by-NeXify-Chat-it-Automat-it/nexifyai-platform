# WARNING: DEAD LEGACY — Cline Issue Assistant is no longer active.
# @cline mentions in issues/PR comments will NOT trigger automated responses.
# The issue_comment trigger has been REMOVED to prevent automatic Cline runs.
# The environment: cline-actions has been REMOVED to prevent spurious GitHub Deployments.
# Goose / DOS-Governance is the current AI standard.
# Legacy since: 2025 | Disabled: 2026-05-24

name: Cline Issue Assistant [LEGACY - DISABLED]

on:
  # issue_comment trigger intentionally REMOVED.
  # Cline must not auto-respond to @cline mentions — caused failed GitHub Deployments
  # via the cline-actions environment on every comment.
  workflow_dispatch:
    inputs:
      issue_url:
        description: "Issue URL to analyze (manual emergency use only)"
        required: true
        type: string

env:
  ACTIONS_STEP_DEBUG: false

jobs:
  respond:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # environment: cline-actions
    # REMOVED — caused spurious GitHub Deployments on every issue comment with @cline.
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cline CLI
        run: npm install -g @cline/cli

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Configure API Provider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cline auth --provider openrouter --apikey "$OPENROUTER_API_KEY"

      - name: Run Cline Analysis
        id: analysis
        env:
          ISSUE_URL: ${{ inputs.issue_url }}
        run: |
          RESULT=$(./git-scripts/analyze-issue.sh "$ISSUE_URL" "Analyze root cause and provide recommendations." 2>&1 || echo "Analysis failed")
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Analysis as Comment
        uses: actions/github-script@v9
        with:
          script: |
            const result = `${{ steps.analysis.outputs.result }}`;
            const issueUrl = `${{ inputs.issue_url }}`;
            const issueNumber = parseInt(issueUrl.split('/').pop());
            const body = `## 🤖 Cline Analysis (Legacy Manual)\n\n${result}\n\n---\n*Manual trigger only — Cline auto-responder is disabled*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });