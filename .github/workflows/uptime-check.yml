name: Uptime Check

on:
  schedule:
    - cron: '*/5 * * * *'  # Alle 5 Minuten
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uptime:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check Website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://nexifyai.cloud)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Website returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ Website OK (HTTP $STATUS)"

      - name: Check Backend Health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.nexifyai.cloud/api/health 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend API Health OK"
          else
            echo "⚠️  Backend Health returned $STATUS (backend may be starting)"
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "## 🚨 Uptime Alert" >> $GITHUB_STEP_SUMMARY
          echo "One or more health checks failed at $(date -u)." >> $GITHUB_STEP_SUMMARY
