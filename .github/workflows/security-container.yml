name: Security — Container (Trivy)

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "infrastructure/docker/**"
      - "services/api/**"
      - "infrastructure/**"
      - ".github/workflows/security*.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "infrastructure/docker/**"
      - "services/api/**"
      - "infrastructure/**"
      - ".github/workflows/security*.yml"
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.deb 2>/dev/null \
            || curl -sL -o /tmp/trivy.deb https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.deb
          dpkg -i /tmp/trivy.deb 2>/dev/null || sudo dpkg -i /tmp/trivy.deb 2>/dev/null
          trivy version
      - name: Trivy Scan (HIGH/CRITICAL — BLOCKING)
        run: |
          trivy filesystem --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  trivy-sarif:
    name: Trivy SARIF Upload
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.deb 2>/dev/null \
            || curl -sL -o /tmp/trivy.deb https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.deb
          dpkg -i /tmp/trivy.deb 2>/dev/null || sudo dpkg -i /tmp/trivy.deb 2>/dev/null
          trivy version
      - name: Trivy Scan (SARIF)
        run: |
          trivy filesystem --severity HIGH,CRITICAL,MEDIUM --format sarif --output trivy-results.sarif --no-progress .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
