name: Security — Container (Trivy)

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "infrastructure/docker/**"
      - "services/api/**"
      - "infrastructure/**"
      - ".github/workflows/security*.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "infrastructure/docker/**"
      - "services/api/**"
      - "infrastructure/**"
      - ".github/workflows/security*.yml"
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.0

      - name: Trivy Scan (HIGH/CRITICAL — BLOCKING)
        run: |
          trivy filesystem \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .

  trivy-sarif:
    name: Trivy SARIF Upload
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.0

      - name: Trivy Scan (SARIF)
        run: |
          trivy filesystem \
            --severity HIGH,CRITICAL,MEDIUM \
            --format sarif \
            --output trivy-results.sarif \
            --no-progress \
            .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
