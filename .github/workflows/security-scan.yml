name: Security Scan — Trivy + Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # Täglich 07:00 UTC

jobs:
  # ═══════════════════════════════════════
  # 1. SECRET SCAN (Gitleaks)
  # ═══════════════════════════════════════
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  # ═══════════════════════════════════════
  # 2. DEPENDENCY AUDIT (npm)
  # ═══════════════════════════════════════
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
      - name: NPM Audit (HIGH/CRITICAL only)
        run: npm audit --audit-level=high 2>&1 | tail -20
        continue-on-error: true

  # ═══════════════════════════════════════
  # 3. PYTHON DEPENDENCY SCAN (Safety)
  # ═══════════════════════════════════════
  python-safety:
    name: Python Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Safety
        run: pip install safety 2>/dev/null || pip install safety --break-system-packages 2>/dev/null
      - name: Scan Python dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            safety check -r backend/requirements.txt --full-report 2>&1 | head -30
          else
            echo "No requirements.txt found"
          fi
        continue-on-error: true

  # ═══════════════════════════════════════
  # 4. REPORT SUMMARY
  # ═══════════════════════════════════════
  report:
    name: Security Report Summary
    needs: [gitleaks, npm-audit, python-safety]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Safety | ${{ needs.python-safety.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
