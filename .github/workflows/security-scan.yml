name: Security Scan — Trivy + Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # Täglich 07:00 UTC

jobs:
  # ═══════════════════════════════════════
  # 1. SECRET SCAN (Gitleaks)
  # ═══════════════════════════════════════
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  # ═══════════════════════════════════════
  # 2. DEPENDENCY AUDIT (npm)
  # ═══════════════════════════════════════
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm install
      - name: NPM Audit (HIGH/CRITICAL only)
        run: npm audit --audit-level=high 2>&1 | tail -20
        continue-on-error: true

  # ═══════════════════════════════════════
  # 3. PYTHON DEPENDENCY SCAN (Safety)
  # ═══════════════════════════════════════
  python-safety:
    name: Python Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Safety
        run: pip install safety 2>/dev/null || pip install safety --break-system-packages 2>/dev/null
      - name: Scan Python dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            safety check -r backend/requirements.txt --full-report 2>&1 | head -30
          else
            echo "No requirements.txt found"
          fi
        continue-on-error: true

  # ═══════════════════════════════════════
  # 4. LICENSE SCAN (License Checker)
  # ═══════════════════════════════════════
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Check NPM Licenses
        run: |
          cd frontend
          npm install --silent 2>/dev/null
          npx license-checker --production --summary --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Python-2.0;CC0-1.0;Unlicense" 2>&1 | head -30
        continue-on-error: true

      - name: Check Python Licenses
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-licenses 2>/dev/null
            pip-licenses --format=markdown 2>&1 | head -30 || true
          fi
        continue-on-error: true

  # ═══════════════════════════════════════
  # 5. CONTAINER SCAN (Trivy)
  # ═══════════════════════════════════════
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Dockerfiles for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ═══════════════════════════════════════
  # 6. SBOM GENERATION (CycloneDX)
  # ═══════════════════════════════════════
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Frontend SBOM
        run: |
          cd frontend
          npm install --silent 2>/dev/null || true
          npx @cyclonedx/cyclonedx-npm --output-file ../sbom-frontend.json --format json 2>&1 || echo "SBOM frontend skipped"

      - name: Generate Backend SBOM
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install cyclonedx-bom 2>/dev/null || pip install cyclonedx-bom --break-system-packages 2>/dev/null
            cyclonedx-py -r backend/requirements.txt -o sbom-backend.json 2>&1 || echo "SBOM backend skipped"
          fi

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-*.json
          retention-days: 90

  # ═══════════════════════════════════════
  # 7. REPORT SUMMARY
  # ═══════════════════════════════════════
  report:
    name: Security Report Summary
    needs: [gitleaks, npm-audit, python-safety, trivy, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Safety | ${{ needs.python-safety.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | ${{ needs.trivy.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM | ${{ needs.sbom.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
