# Gitleaks Configuration for NeXifyAI
# Generated by Project Leader — 2026-05-09
# Fixes CI Security Gate: DOS Audit T10

title = "NeXifyAI Gitleaks Config"

[extend]
useDefault = true

[allowlist]
  description = "Known-safe patterns: default/fallback secrets, test tokens, backup files"

  paths = [
    '''Admin\.js\.backup''',
    '''test_credentials\.md''',
    '''test_reports/''',
    '''backend/services/llm_provider\.py''',
    '''backend/\.env''',
  ]

  regexes = [
    '''os\.environ\.get\(["']SUPABASE_JWT_SECRET["']''',
    '''os\.environ\.get\(["']SUPABASE_ANON_KEY["']''',
    '''"example":\s*"curl''',
    # Default/fallback SUPABASE_JWT_SECRET value (overridden in production)
    '''7qhWu1m2qAkVMFkagKHvQcdlx9yFzCl8wPm1P''',
    # Rotated LLM provider API key (overridden in production)
    '''sk-380''',
    # Historical committed backend/.env values (now gitignored, rotated)
    '''sk-eme''',
    '''re_Whq''',
    '''240be5''',
  ]

# Per-rule allowlists for known-safe patterns
[[rules]]
  id = "generic-api-key"
  [rules.allowlist]
    paths = [
      '''backend/tests/''',
      '''test_reports/''',
      '''memory/test_credentials\.md''',
      '''backend/services/llm_provider\.py''',
    ]
    regexes = [
      '''nxa_live_''',
      '''nxa_test_''',
      '''sk-test-''',
      '''sk-380''',
    ]

[[rules]]
  id = "jwt"
  [rules.allowlist]
    paths = [
      '''backend/tests/''',
      '''backend/routes/''',
      '''test_reports/''',
    ]

[[rules]]
  id = "curl-auth-header"
  [rules.allowlist]
    paths = [
      '''frontend/src/''',
      '''backend/routes/api_v1_routes\.py''',
    ]
