[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexifyai-platform"
version = "3.2.0"
description = "NeXifyAI — Enterprise AI Platform with LangChain/LangGraph Agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "neXify", email = "support@nexify-automate.com"},
]
keywords = ["ai", "agents", "langchain", "langgraph", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Customer Service",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "motor>=3.6.0",
    "slowapi>=0.1.9",
    "langchain>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client>=1.12.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "crawl4ai>=0.4.0",
    "resend>=0.8.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.12.0",
    "debugpy>=1.8.0",
    "ipython>=8.0.0",
]
prod = [
    "langsmith>=0.1.0",
    "sentry-sdk>=2.0.0",
    "prometheus-client>=0.21.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/api/tests"]
python_files = ["test_*.py"]
